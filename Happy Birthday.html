<!DOCTYPE html>
<html lang="th">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Happy Birthday THIDARAT</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Happy%20Birthday_files/bootstrap.css">
    <link rel="stylesheet" href="Happy%20Birthday_files/style.css">
</head>

<body>
    <!-- Modern Intro / Loader Screen (Pink, White, Turquoise) -->
    <div class="loader">
        <div class="loader-bg-glow glow-pink"></div>
        <div class="loader-bg-glow glow-turquoise"></div>
        <div class="loader-card">
            <div class="intro-badge">
                <span class="intro-icon">🎂</span>
            </div>
            <span class="intro-subtitle">HAPPY BIRTHDAY</span>
            <h1 class="intro-title">สุขสันต์วันเกิด<br><span class="intro-name">THIDARAT</span> 💕</h1>
            <p class="intro-desc">ขอให้มีความสุขมากๆ ในวันพิเศษนี้นะคะ ✨<br>แตะปุ่มด้านล่างเพื่อเปิดการ์ดอวยพร</p>
            <button id="play" class="modern-play-btn">
                <span>START SURPRISE ✨</span>
            </button>
        </div>
    </div>

    <audio class="song" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
        <source src="Happy%20Birthday_files/music.mp3" type="audio/mpeg">
        Your browser isn't invited for super fun audio time.
    </audio>

    <canvas id="confetti"></canvas>

    <div class="main">
        <div class="container pt-5">
            <div class="row">
                <div class="col-12 col-xl-7 col-lg-8 mx-auto text-center">
                    <img src="Happy%20Birthday_files/banner.png" alt="Happy Birthday Banner" style="max-width: 650px; width: 100%; display: block; margin: 0 auto;">
                </div>
                <div class="col-12 text-center">
                    <div id="name" class="area">THIDARAT</div>
                </div>

                <div class="col-12 text-center">
                    <div class="type-wrap">
                        <div id="typed-strings" class="typing">
                            <h2>Happy Birthday to Mine <i id="nae">THIDARAT</i> 💕</h2>
                            <h2>Have a wonderful day ✨</h2>
                            <h2>I wish you all the best 💖</h2>
                        </div>
                        <span id="typed" style="white-space:pre;"></span>
                    </div>
                </div>

                <div class="col-12 col-xl-7 col-lg-8 mx-auto text-center">
                    <img src="Happy%20Birthday_files/cake.svg" alt="Birthday Cake" style="max-width: 520px; width: 100%; margin: 10px auto;">
                </div>
            </div>
        </div>
        <img src="Happy%20Birthday_files/Balloon-Border.png" class="balloon-border" width="100%">
    </div>
</body>
<script src="Happy%20Birthday_files/snowflakes.js"></script>
<script src="Happy%20Birthday_files/jquery.js"></script>
<script src="Happy%20Birthday_files/typed.js"></script>
<script src="Happy%20Birthday_files/script.js"></script>

</html>
